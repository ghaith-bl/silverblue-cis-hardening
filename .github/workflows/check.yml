name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # the same file as before a push on my machine: ASCII only, bash -n (also the
      # kickstart's %post), python syntax, shellcheck (warnings), private info (generic)
      - name: lint (tools/lint.sh)
        run: |
          shellcheck --version | head -2
          tools/lint.sh

      # browsevm viewer relay (beta): bytes / fds in order, busy compositor, limits
      - name: tests (python3 -m unittest)
        run: python3 -I -B -m unittest discover -s tests -v
